# POC trancheur LaStarter v2 — adapté de frappe/frappe_docker pwd.yml
# Deux sites sur un bench : id.localhost (identité / IdP OIDC) et
# crm.localhost (CRM + Helpdesk). Passerelle publiée sur le port hôte 80 :
# le nginx frappe_docker transmet Host: $host SANS port, donc Frappe dérive
# toutes ses URLs publiques sans port (redirect_uri OIDC compris) — la
# passerelle DOIT écouter sur 80 pour que les URLs dérivées soient valides.
#
# Prérequis : image construite par poc/build.sh (APPS_JSON=poc/apps.json
# pour le POC minimal, poc/apps-full.json pour l'architecture complète).

x-default-deploy: &default_deploy
  restart_policy:
    condition: on-failure

x-default-volumes: &default_volumes
  - sites:/home/frappe/frappe-bench/sites
  - logs:/home/frappe/frappe-bench/logs

services:
  backend:
    image: lasarter-bench:full
    networks:
      - frappe_network
    deploy: *default_deploy
    volumes: *default_volumes
    # L'échange de tokens OIDC (site crm.localhost -> site id.localhost) est
    # fait côté serveur : glibc ne résout pas *.localhost, on pointe les noms
    # vers l'hôte (Docker Desktop publie 8081 sur 127.0.0.1).
    extra_hosts:
      - "id.localhost:host-gateway"
      - "crm.localhost:host-gateway"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: lasarter-bench:full
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes: *default_volumes

  create-sites:
    image: lasarter-bench:full
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: none
    volumes: *default_volumes
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ ! -d "sites/id.localhost" ]; then
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=admin --db-root-username=root --db-root-password=admin --set-default id.localhost;
        else
          echo "Site id.localhost déjà présent, création ignorée";
        fi;
        if [ ! -d "sites/crm.localhost" ]; then
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=admin --db-root-username=root --db-root-password=admin --install-app crm crm.localhost;
          bench --site crm.localhost install-app helpdesk;
        else
          echo "Site crm.localhost déjà présent, création ignorée";
        fi;

  db:
    image: mariadb:11.8
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    deploy: *default_deploy
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: lasarter-bench:full
    networks:
      - frappe_network
    depends_on:
      - websocket
      - backend
    deploy: *default_deploy
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      # Multi-sites : le Host de la requête désigne le site Frappe
      FRAPPE_SITE_NAME_HEADER: $$host
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes: *default_volumes
    ports:
      - "80:8080"

  queue-long:
    image: lasarter-bench:full
    networks:
      - frappe_network
    deploy: *default_deploy
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes: *default_volumes
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: lasarter-bench:full
    networks:
      - frappe_network
    deploy: *default_deploy
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes: *default_volumes
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy: *default_deploy
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy: *default_deploy

  scheduler:
    image: lasarter-bench:full
    networks:
      - frappe_network
    deploy: *default_deploy
    command:
      - bench
      - schedule
    volumes: *default_volumes
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: lasarter-bench:full
    networks:
      - frappe_network
    # L'authentification des sockets fait un fetch vers l'origine du client
    # (http://<site>.localhost) : sans ces entrées, le conteneur ne résout
    # pas les *.localhost et chaque connexion recoit « Unauthorized: fetch
    # failed » (bandeau Raven « Realtime events aren't working »).
    extra_hosts:
      - "id.localhost:host-gateway"
      - "crm.localhost:host-gateway"
    deploy: *default_deploy
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes: *default_volumes
    depends_on:
      configurator:
        condition: service_completed_successfully

  stalwart:
    # Epingle v0.16.27 : l'app Frappe Mail (archivee 10/08/2026) a ete
    # developpee contre la ligne 0.16 (v0.16.16/17 encadrent exactement le
    # gel) ; la v1.0 (26/10) a change le schema de gestion (ex. isEnabled
    # supprime de Domain) et casse le pairage. latest = risque de rupture
    # silencieuse, jamais en POC.
    image: stalwartlabs/stalwart:v0.16.27
    networks:
      - frappe_network
    deploy: *default_deploy
    environment:
      # Epingle l admin de recuperation : complete le bootstrap sans UI
      STALWART_RECOVERY_ADMIN: "admin:AbezsvFiQCp48FtL"
      # URL publique annoncee dans la session JMAP (purement env, zero
      # hardcode) : en prod, remplacer par https://mail.<domaine-client>
      STALWART_PUBLIC_URL: "http://stalwart:8080"
    ports:
      # Admin + JMAP : http://localhost:8081 — IMAP 143/993 — SMTP 25
      - "8081:8080"
      - "143:143"
      - "993:993"
      - "25:25"
    volumes:
      # Layout v0.16 : la configuration vit dans /etc/stalwart (volume nomme,
      # amorce avec poc/stalwart-config-minimal.json — le wizard v1.0 y
      # ecrivait des null que le schema v0.16 refuse sur cacheSize u64),
      # les donnees dans /var/lib/stalwart.
      - stalwart-config:/etc/stalwart
      - stalwart-data:/var/lib/stalwart

volumes:
  db-data:
  stalwart-config:
  stalwart-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
